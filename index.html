<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── GREETING ─────────────────────────────────────── -->
  <header class="greeting-section">
    <div class="greeting-text">
      <p id="greeting-msg">Good morning!</p>
      <p id="datetime"></p>
    </div>
    <button id="btn-theme" aria-label="Toggle dark mode">🌙 Dark Mode</button>
  </header>

  <main class="dashboard">

    <!-- ── FOCUS TIMER ──────────────────────────────────── -->
    <section class="card" id="timer-card">
      <h2>⏱ Focus Timer</h2>

      <!-- Duration presets -->
      <div class="duration-picker">
        <button class="btn-preset" data-minutes="5">5 min</button>
        <button class="btn-preset" data-minutes="10">10 min</button>
        <button class="btn-preset" data-minutes="15">15 min</button>
        <button class="btn-preset" data-minutes="25">25 min</button>
        <button class="btn-preset" data-minutes="45">45 min</button>
        <button class="btn-preset" data-minutes="60">60 min</button>
      </div>

      <!-- Custom duration input -->
      <div class="duration-custom-row">
        <input type="number" id="duration-input" min="1" max="120" placeholder="1–120" />
        <span class="duration-label">min</span>
        <button id="btn-apply-duration">Apply</button>
      </div>

      <div id="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="btn-start">Start</button>
        <button id="btn-stop">Stop</button>
        <button id="btn-reset">Reset</button>
      </div>
    </section>

    <!-- ── TO-DO LIST ────────────────────────────────────── -->
    <section class="card" id="todo-card">
      <h2>📝 To-Do List</h2>
      <div class="todo-input-row">
        <input type="text" id="todo-input" placeholder="Add a new task…" maxlength="120" />
        <button id="btn-add-task">Add</button>
      </div>
      <ul id="todo-list"></ul>
    </section>

    <!-- ── QUICK LINKS ───────────────────────────────────── -->
    <section class="card" id="links-card">
      <h2>🔗 Quick Links</h2>
      <div class="link-input-row">
        <input type="text" id="link-name-input" placeholder="Label (e.g. YouTube)" maxlength="30" />
        <input type="url"  id="link-url-input"  placeholder="https://…" />
        <button id="btn-add-link">Add</button>
      </div>
      <div id="links-grid"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
